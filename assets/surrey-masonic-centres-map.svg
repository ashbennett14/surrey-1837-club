<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Masonic centres in Surrey</title>
  <desc id="desc">A simplified Surrey map with labelled pins for commonly used Masonic centres around the Province.</desc>
  <defs>
    <linearGradient id="mapBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf9ef"/>
      <stop offset="1" stop-color="#d8ebff"/>
    </linearGradient>
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0d223f" flood-opacity="0.22"/>
    </filter>
    <style>
      .bg{fill:url(#mapBg)}
      .surrey{fill:#eef7ff;stroke:#0d376d;stroke-width:5;stroke-linejoin:round}
      .road{stroke:#c59a36;stroke-width:3;fill:none;stroke-dasharray:10 12;opacity:.7}
      .pin{fill:#0d376d;stroke:#c59a36;stroke-width:4;filter:url(#pinShadow)}
      .dot{fill:#fff}
      .title{font:700 34px Georgia,serif;fill:#0d223f}
      .label{font:700 22px Arial,sans-serif;fill:#0d223f}
      .note{font:600 18px Arial,sans-serif;fill:#4b5b70}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" rx="30"/>
  <path class="surrey" d="M250 128 448 82 648 96 854 176 978 330 912 524 756 674 512 706 290 616 178 420z"/>
  <path class="road" d="M252 382C392 310 514 296 654 334s220 118 294 192"/>
  <path class="road" d="M390 116c70 120 108 236 94 350s-52 176-116 220"/>
  <path class="road" d="M760 184c-48 112-92 214-84 334 4 58 24 108 66 158"/>
  <text x="600" y="62" text-anchor="middle" class="title">Surrey Masonic Centres</text>
  <text x="600" y="755" text-anchor="middle" class="note">Indicative guide only. Always check the summons or official centre finder before travelling.</text>

  <g transform="translate(715 238)"><path class="pin" d="M0-28c22 0 40 18 40 40 0 31-40 76-40 76S-40 43-40 12c0-22 18-40 40-40z"/><circle class="dot" r="13"/></g>
  <text x="770" y="252" class="label">Croydon</text>
  <g transform="translate(566 250)"><path class="pin" d="M0-28c22 0 40 18 40 40 0 31-40 76-40 76S-40 43-40 12c0-22 18-40 40-40z"/><circle class="dot" r="13"/></g>
  <text x="462" y="256" class="label">Surbiton</text>
  <g transform="translate(438 332)"><path class="pin" d="M0-28c22 0 40 18 40 40 0 31-40 76-40 76S-40 43-40 12c0-22 18-40 40-40z"/><circle class="dot" r="13"/></g>
  <text x="326" y="340" class="label">Chertsey</text>
  <g transform="translate(400 520)"><path class="pin" d="M0-28c22 0 40 18 40 40 0 31-40 76-40 76S-40 43-40 12c0-22 18-40 40-40z"/><circle class="dot" r="13"/></g>
  <text x="280" y="534" class="label">Guildford</text>
  <g transform="translate(332 610)"><path class="pin" d="M0-28c22 0 40 18 40 40 0 31-40 76-40 76S-40 43-40 12c0-22 18-40 40-40z"/><circle class="dot" r="13"/></g>
  <text x="190" y="646" class="label">Godalming</text>
  <g transform="translate(246 440)"><path class="pin" d="M0-28c22 0 40 18 40 40 0 31-40 76-40 76S-40 43-40 12c0-22 18-40 40-40z"/><circle class="dot" r="13"/></g>
  <text x="128" y="438" class="label">Farnham</text>
