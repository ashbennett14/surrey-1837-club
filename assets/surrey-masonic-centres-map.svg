<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Masonic centres in Surrey</title>
  <desc id="desc">A simplified Surrey centre guide with grouped location labels.</desc>
  <defs>
    <linearGradient id="mapBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf9ef"/>
      <stop offset="1" stop-color="#e5f3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0d223f" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg{fill:url(#mapBg)}
      .county{fill:#eef7ff;stroke:#0d376d;stroke-width:5;stroke-linejoin:round;filter:url(#shadow)}
      .route{stroke:#c59a36;stroke-width:4;stroke-dasharray:10 14;fill:none;opacity:.7}
      .pin{fill:#0d376d;stroke:#c59a36;stroke-width:4}
      .dot{fill:#fff}
      .card{fill:#fff;stroke:#c59a36;stroke-width:2}
      .title{font:700 36px Georgia,serif;fill:#0d223f}
      .label{font:800 23px Arial,sans-serif;fill:#0d223f}
      .small{font:600 18px Arial,sans-serif;fill:#4b5b70}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800" rx="30"/>
  <text x="600" y="64" text-anchor="middle" class="title">Surrey Masonic Centres</text>
  <path class="county" d="M286 132 470 90 660 104 858 184 978 326 910 526 748 682 510 710 294 620 178 418z"/>
  <path class="route" d="M260 388c164-74 304-74 456-20 90 32 154 82 232 158"/>
  <path class="route" d="M416 128c54 106 80 224 64 344-12 92-48 154-110 212"/>

  <g transform="translate(566 260)"><path class="pin" d="M0-26c21 0 38 17 38 38 0 29-38 72-38 72S-38 41-38 12c0-21 17-38 38-38z"/><circle class="dot" r="12"/></g>
  <g transform="translate(720 250)"><path class="pin" d="M0-26c21 0 38 17 38 38 0 29-38 72-38 72S-38 41-38 12c0-21 17-38 38-38z"/><circle class="dot" r="12"/></g>
  <g transform="translate(438 340)"><path class="pin" d="M0-26c21 0 38 17 38 38 0 29-38 72-38 72S-38 41-38 12c0-21 17-38 38-38z"/><circle class="dot" r="12"/></g>
  <g transform="translate(654 366)"><path class="pin" d="M0-26c21 0 38 17 38 38 0 29-38 72-38 72S-38 41-38 12c0-21 17-38 38-38z"/><circle class="dot" r="12"/></g>
  <g transform="translate(762 486)"><path class="pin" d="M0-26c21 0 38 17 38 38 0 29-38 72-38 72S-38 41-38 12c0-21 17-38 38-38z"/><circle class="dot" r="12"/></g>
  <g transform="translate(400 528)"><path class="pin" d="M0-26c21 0 38 17 38 38 0 29-38 72-38 72S-38 41-38 12c0-21 17-38 38-38z"/><circle class="dot" r="12"/></g>

  <rect class="card" x="74" y="116" width="300" height="178" rx="16"/>
  <text x="104" y="154" class="label">North &amp; West</text>
  <text x="104" y="190" class="small">Chertsey</text>
  <text x="104" y="222" class="small">Farnham</text>
  <text x="104" y="254" class="small">Bisley / Brookwood</text>

  <rect class="card" x="826" y="118" width="300" height="178" rx="16"/>
  <text x="856" y="156" class="label">London Side</text>
  <text x="856" y="192" class="small">Croydon</text>
  <text x="856" y="224" class="small">Surbiton</text>
  <text x="856" y="256" class="small">Sutton / Esher</text>

  <rect class="card" x="114" y="596" width="346" height="112" rx="16"/>
  <text x="144" y="636" class="label">South &amp; Central</text>
  <text x="144" y="672" class="small">Guildford, Godalming and nearby centres</text>

  <rect class="card" x="704" y="596" width="346" height="112" rx="16"/>
  <text x="734" y="636" class="label">East Surrey</text>
  <text x="734" y="672" class="small">Nutfield, Redhill and surrounding venues</text>

  <text x="600" y="758" text-anchor="middle" class="small">Indicative guide only. Always check the summons or official centre finder before travelling.</text>
</svg>
