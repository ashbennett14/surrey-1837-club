<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Progressive offices in a Craft Lodge</title>
  <desc id="desc">A clean stepped infographic showing a common progression through Lodge offices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf9ef"/>
      <stop offset="1" stop-color="#e6f4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0d223f" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:url(#bg)}
      .step{fill:#fff;stroke:#0d376d;stroke-width:3;filter:url(#shadow)}
      .top{fill:#0d376d}
      .gold{fill:#c59a36}
      .rule{stroke:#c59a36;stroke-width:5;stroke-linecap:round}
      .title{font:700 36px Georgia,serif;fill:#0d223f}
      .label{font:800 22px Arial,sans-serif;fill:#0d223f}
      .small{font:600 18px Arial,sans-serif;fill:#4b5b70}
      .white{fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="30"/>
  <text x="600" y="70" text-anchor="middle" class="title">The Progressive Offices</text>
  <text x="600" y="106" text-anchor="middle" class="small">A common pattern. Every Lodge manages progression in its own way.</text>

  <rect x="172" y="132" width="856" height="86" rx="16" fill="#0d376d"/>
  <text x="600" y="168" text-anchor="middle" class="label white">Progression is service, not a race</text>
  <text x="600" y="198" text-anchor="middle" class="small white">Speak with your Mentor and Lodge officers about time, confidence and interest.</text>

  <line class="rule" x1="142" y1="596" x2="1058" y2="596"/>
  <path class="rule" d="M1058 596l-28-24M1058 596l-28 24"/>

  <g transform="translate(82 508)">
    <rect class="step" width="126" height="88" rx="13"/><rect class="top" width="126" height="20" rx="10"/>
    <text x="63" y="57" text-anchor="middle" class="label">Steward</text>
  </g>
  <g transform="translate(216 462)">
    <rect class="step" width="132" height="134" rx="13"/><rect class="top" width="132" height="20" rx="10"/>
    <text x="66" y="62" text-anchor="middle" class="label">Inner</text>
    <text x="66" y="91" text-anchor="middle" class="label">Guard</text>
  </g>
  <g transform="translate(356 416)">
    <rect class="step" width="132" height="180" rx="13"/><rect class="top" width="132" height="20" rx="10"/>
    <text x="66" y="82" text-anchor="middle" class="label">Junior</text>
    <text x="66" y="111" text-anchor="middle" class="label">Deacon</text>
  </g>
  <g transform="translate(496 370)">
    <rect class="step" width="132" height="226" rx="13"/><rect class="top" width="132" height="20" rx="10"/>
    <text x="66" y="99" text-anchor="middle" class="label">Senior</text>
    <text x="66" y="128" text-anchor="middle" class="label">Deacon</text>
  </g>
  <g transform="translate(636 324)">
    <rect class="step" width="132" height="272" rx="13"/><rect class="top" width="132" height="20" rx="10"/>
    <text x="66" y="118" text-anchor="middle" class="label">Junior</text>
    <text x="66" y="147" text-anchor="middle" class="label">Warden</text>
  </g>
  <g transform="translate(776 278)">
    <rect class="step" width="132" height="318" rx="13"/><rect class="top" width="132" height="20" rx="10"/>
    <text x="66" y="136" text-anchor="middle" class="label">Senior</text>
    <text x="66" y="165" text-anchor="middle" class="label">Warden</text>
  </g>
  <g transform="translate(916 232)">
    <rect class="step" width="156" height="364" rx="13"/><rect class="gold" width="156" height="28" rx="12"/>
    <text x="78" y="152" text-anchor="middle" class="label">Worshipful</text>
    <text x="78" y="181" text-anchor="middle" class="label">Master</text>
  </g>

  <rect x="174" y="638" width="852" height="54" rx="14" fill="#fff" stroke="#c59a36" stroke-width="3"/>
  <text x="600" y="672" text-anchor="middle" class="small">Secretary, Treasurer, DC, Almoner, Charity Steward and Mentor are also important roles.</text>
</svg>
